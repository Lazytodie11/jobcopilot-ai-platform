spring.application.name=jobcopilot

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jobcopilot}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:ThisIsASecretKeyForJobCopilotJwtDemoMustBeLongEnough12345}
jwt.expiration=86400000

# ── Spring AI ─────────────────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.model.chat=openai
spring.ai.openai.chat.options.model=gpt-4.1-mini
spring.ai.model.embedding=openai
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# ── pgvector ──────────────────────────────────────────────────────────────────
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_URL:localhost:9092}
spring.kafka.consumer.group-id=jobcopilot-embedding-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.yipeng.jobcopilot.event
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.yipeng.jobcopilot=DEBUG
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{36}] - %msg%n

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000